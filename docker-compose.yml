# One command for the whole stack: `docker compose up --build`
# Starts PostgreSQL 16, then the API which runs migrations + idempotent seed on boot.
# Values can be overridden from a local .env file (never committed).
name: gdgoc-core-team

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gdgoc
      POSTGRES_PASSWORD: gdgoc
      POSTGRES_DB: gdgoc
    ports:
      - "${DB_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gdgoc -d gdgoc"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_HOST_PORT:-8080}:8080"
    environment:
      APP_ENV: ${APP_ENV:-development}
      PORT: "8080"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      DATABASE_URL: postgres://gdgoc:gdgoc@db:5432/gdgoc?sslmode=disable
      AUTO_MIGRATE: "true"
      SEED_ON_START: "true"
      SEED_PASSWORD: ${SEED_PASSWORD:-GdgocUnsri2026!}
      # Local development default only. Production secrets are set in the Render dashboard.
      JWT_SECRET: ${JWT_SECRET:-local-dev-only-jwt-secret-please-change-0123456789}
      JWT_TTL: ${JWT_TTL:-2h}
      BCRYPT_COST: ${BCRYPT_COST:-12}
      LOGIN_RATE_LIMIT: ${LOGIN_RATE_LIMIT:-5}
      LOGIN_RATE_WINDOW: ${LOGIN_RATE_WINDOW:-1m}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URL: ${GOOGLE_REDIRECT_URL:-http://localhost:8080/api/v1/auth/google/callback}
      ALLOWED_EMAIL_DOMAIN: ${ALLOWED_EMAIL_DOMAIN:-gdgoc-unsri.test}
    restart: unless-stopped

volumes:
  pgdata:
